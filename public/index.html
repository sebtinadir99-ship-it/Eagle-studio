<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Camera Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      margin: 5px 0 6px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 22px;
      background: #000;
      aspect-ratio: 3 / 4;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #filterOverlay {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      font-size: 90px;
      pointer-events: none;
      display: none;
      line-height: 1;
    }

    .filters-title {
      margin: 18px 0 10px;
      font-size: 15px;
      color: #cbd5e1;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .filter {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      color: white;
      border-radius: 16px;
      padding: 12px 5px;
      cursor: pointer;
      font-size: 14px;
      transition: .2s;
    }

    .filter:hover {
      background: rgba(255,255,255,.15);
    }

    .filter.active {
      background: rgba(255,255,255,.22);
      border: 2px solid white;
      transform: translateY(-2px);
    }

    .filter-icon {
      display: block;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button.main {
      flex: 1;
      border: none;
      border-radius: 16px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #start {
      background: #22c55e;
      color: white;
    }

    #capture {
      background: white;
      color: #111827;
    }

    #capture:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      margin: 15px 0 0;
      font-size: 14px;
      color: #cbd5e1;
      min-height: 20px;
    }

    canvas {
      display: none;
    }
  </style>

</head>

<body>

<div class="app">

  <h1>📸 Camera Studio</h1>

  <div class="subtitle">
    اختر الفيلتر ثم شغّل الكاميرا والتقط صورتك
  </div>

  <div class="camera-box">

```
<video id="video" autoplay playsinline></video>

<div id="filterOverlay">🐶</div>
```

  </div>

  <div class="filters-title">
    اختر الفيلتر:
  </div>

  <div class="filters">

```
<button class="filter active" data-filter="🐶">
  <span class="filter-icon">🐶</span>
  كلب
</button>

<button class="filter" data-filter="🐱">
  <span class="filter-icon">🐱</span>
  قط
</button>

<button class="filter" data-filter="🐘">
  <span class="filter-icon">🐘</span>
  خرطوم فيل
</button>
```

  </div>

  <div class="buttons">

```
<button id="start" class="main">
  🎥 تشغيل الكاميرا
</button>

<button id="capture" class="main" disabled>
  📸 التقاط
</button>
```

  </div>

  <p id="status"></p>

<canvas id="canvas"></canvas>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const start = document.getElementById("start");
const capture = document.getElementById("capture");
const status = document.getElementById("status");
const overlay = document.getElementById("filterOverlay");

let stream = null;
let selectedFilter = "🐶";


// اختيار الفيلتر
document.querySelectorAll(".filter").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".filter")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    selectedFilter = button.dataset.filter;

    overlay.textContent = selectedFilter;
    overlay.style.display = "block";

  });

});


// تشغيل الكاميرا
start.onclick = async () => {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    video.srcObject = stream;

    capture.disabled = false;

    overlay.style.display = "block";

    status.textContent = "الكاميرا تعمل ✅";

  } catch (error) {

    console.error(error);

    status.textContent =
      "لم يتم السماح باستخدام الكاميرا ❌";

  }

};


// التقاط الصورة
capture.onclick = () => {

  if (!video.videoWidth) {
    status.textContent = "انتظر حتى تعمل الكاميرا";
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");

  // الصورة من الكاميرا
  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  // إضافة الفيلتر إلى الصورة
  ctx.font = Math.floor(canvas.width * 0.22) + "px Arial";

  ctx.textAlign = "center";

  ctx.fillText(
    selectedFilter,
    canvas.width / 2,
    canvas.height * 0.42
  );

  canvas.toBlob(async (blob) => {

    if (!blob) {
      status.textContent = "حدث خطأ في إنشاء الصورة ❌";
      return;
    }

    const data = new FormData();

    data.append(
      "photo",
      blob,
      "camera-test.jpg"
    );

    status.textContent = "جاري إرسال الصورة...";

    try {

      const response = await fetch("/send-photo", {
        method: "POST",
        body: data
      });

      const result = await response.json();

      if (result.ok) {

        status.textContent =
          "تم التقاط الصورة وإرسالها إلى Telegram ✅";

      } else {

        status.textContent =
          "فشل إرسال الصورة ❌";

      }

    } catch (error) {

      console.error(error);

      status.textContent =
        "حدث خطأ أثناء الإرسال ❌";

    }

  }, "image/jpeg", 0.9);

};

</script>

</body>
</html>
